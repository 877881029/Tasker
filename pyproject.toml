[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tasker"
dynamic = ["version"]
description = "Local Windows workbench for current tasks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Pinned to the versions the release builds are tested with.
dependencies = [
    "PySide6==6.11.2",
    "pywin32==312",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-mock==3.15.1",
    "Pillow==12.3.0",
    "PyInstaller==6.22.3",
]

[project.scripts]
tasker = "tasker.__main__:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "webengine: requires Qt WebEngine",
]
