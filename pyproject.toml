[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tasker"
version = "0.1.0"
description = "Local Windows workbench for current tasks"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "markdown-it-py>=3.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-mock>=3.14",
    "Pillow>=10.0",
]

[project.scripts]
tasker = "tasker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "webengine: requires Qt WebEngine",
]
